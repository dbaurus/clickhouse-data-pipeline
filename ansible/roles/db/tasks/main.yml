- name: Установка PostgreSQL 14
  become: yes
  apt:
    name: postgresql
    state: present
    update_cache: yes

- name: Включение wal_level = logical в postgresql.conf
  become: yes
  lineinfile:
    path: /etc/postgresql/14/main/postgresql.conf
    regexp: '^#?wal_level\s*='
    line: 'wal_level = logical'
    backup: yes

- name: Разрешить подключения с любого хоста (listen_addresses)
  become: yes
  lineinfile:
    path: /etc/postgresql/14/main/postgresql.conf
    regexp: '^#?listen_addresses\s*='
    line: "listen_addresses = '0.0.0.0'"
    backup: yes

- name: Добавить правило для логической репликации в pg_hba.conf
  become: yes
  lineinfile:
    path: /etc/postgresql/14/main/pg_hba.conf
    line: "host replication all all md5"
    regexp: "^host\\s+replication\\s+all\\s+all\\s+md5$"
    backup: yes

- name: Разрешить подключения ко всем БД с любого IP
  become: yes
  lineinfile:
    path: /etc/postgresql/14/main/pg_hba.conf
    line: "host all all all md5"
    regexp: "^host\\s+all\\s+all\\s+all\\s+md5$"
    backup: yes

- name: Перезапуск PostgreSQL
  become: yes
  systemd:
    name: postgresql
    state: restarted

- name: Копирование init.sql
  copy:
    src: ../../../config/postgres-init.sql
    dest: /tmp/init.sql

- name: Запуск init.sql
  become: yes
  become_user: postgres
  command: psql -f /tmp/init.sql

- name: Установка Java
  apt:
    name: openjdk-17-jre-headless
    state: present

- name: Скачать и распаковать Kafka
  unarchive:
    src: https://dlcdn.apache.org/kafka/4.0.0/kafka_2.13-4.0.0.tgz
    dest: /opt
    remote_src: yes

- name: Симлинк kafka
  file:
    src: /opt/kafka_2.13-4.0.0
    dest: /opt/kafka
    state: link

- name: Генерация Node ID
  command: /opt/kafka/bin/kafka-storage.sh random-uuid
  register: node_id
  changed_when: false

- name: Сохранение Node ID
  copy:
    content: "{{ node_id.stdout }}"
    dest: /opt/kafka/node_id

- name: Создание директории config/kraft
  become: yes
  file:
    path: /opt/kafka/config/kraft
    state: directory
    mode: '0755'

- name: Настройка server.properties
  copy:
    content: |
      process.roles=broker,controller
      node.id=1
      controller.quorum.voters=1@10.1.15.103:9093

      # Слушаем на нескольких интерфейсах
      listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      # Как называются листнеры
      listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      # Указываем, какой листнер используется для контроллера
      controller.listener.names=CONTROLLER

      # Адрес, по которому другие узлы видят этот
      advertised.listeners=PLAINTEXT://10.1.15.103:9092

      # Где хранить данные
      log.dirs=/tmp/kafka-logs
    dest: /opt/kafka/config/kraft/server.properties

- name: Форматирование хранилища
  command: /opt/kafka/bin/kafka-storage.sh format -t "{{ node_id.stdout }}" -c /opt/kafka/config/kraft/server.properties
  args:
    creates: /tmp/kafka-logs/meta.properties

- name: Создание сервиса Kafka
  copy:
    dest: /etc/systemd/system/kafka.service
    content: |
      [Unit]
      Description=Kafka
      After=network.target
      [Service]
      ExecStart=/opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties
      ExecStop=/opt/kafka/bin/kafka-server-stop.sh
      [Install]
      WantedBy=multi-user.target

- name: Запуск Kafka
  systemd:
    name: kafka
    state: started
    enabled: yes
